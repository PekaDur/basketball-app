<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Košarkaški timovi i igrači</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="#">
                <div class="logo">
                    <i class="fas fa-basketball-ball"></i>
                </div>
                <span class="fw-bold">Košarkaški timovi</span>
            </a>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <!-- Main Content -->
            <div class="col-12">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h3 class="m-0">Pregled košarkaških timova i igrača</h3>
                    <div>
                        <button class="btn btn-primary me-2" data-bs-toggle="modal" data-bs-target="#addTeamModal">
                            <i class="fas fa-plus me-1"></i> Dodaj tim
                        </button>
                        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addPlayerModal">
                            <i class="fas fa-plus me-1"></i> Dodaj igrača
                        </button>
                    </div>
                </div>

                <!-- Teams Section -->
                <div class="card p-4 mb-4">
                    <h4 class="section-title">Timovi</h4>
                    <div class="row" id="teamsContainer">
                        <div class="loading">
                            <div class="spinner-border text-primary" role="status">
                                <span class="visually-hidden">Učitavanje...</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Players Section -->
                <div class="card p-4">
                    <h4 class="section-title">Igrači</h4>
                    <div class="table-responsive">
                        <table class="table table-hover">
                            <thead>
                                <tr>
                                    <th>Ime i prezime</th>
                                    <th>Pozicija</th>
                                    <th>Godine</th>
                                    <th>Tim</th>
                                    <th>Akcije</th>
                                </tr>
                            </thead>
                            <tbody id="playersTableBody">
                                <tr>
                                    <td colspan="5" class="text-center">
                                        <div class="loading">
                                            <div class="spinner-border text-primary" role="status">
                                                <span class="visually-hidden">Učitavanje...</span>
                                            </div>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container"></div>

    <!-- Add Team Modal -->
    <div class="modal fade" id="addTeamModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Dodaj novi tim</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="addTeamForm">
                        <div class="mb-3">
                            <label class="form-label">Naziv tima</label>
                            <input type="text" class="form-control" id="teamName" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Grad</label>
                            <input type="text" class="form-control" id="teamCity" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Godina osnivanja</label>
                            <input type="number" class="form-control" id="teamYear" required min="1900" max="2023">
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Otkaži</button>
                    <button type="button" class="btn btn-primary" id="saveTeamBtn">Sačuvaj</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Add Player Modal -->
    <div class="modal fade" id="addPlayerModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Dodaj novog igrača</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="addPlayerForm">
                        <div class="mb-3">
                            <label class="form-label">Ime i prezime</label>
                            <input type="text" class="form-control" id="playerName" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Pozicija</label>
                            <select class="form-select" id="playerPosition" required>
                                <option value="">Izaberi poziciju</option>
                                <option value="PG">Point Guard (PG)</option>
                                <option value="SG">Shooting Guard (SG)</option>
                                <option value="SF">Small Forward (SF)</option>
                                <option value="PF">Power Forward (PF)</option>
                                <option value="C">Center (C)</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Godine</label>
                            <input type="number" class="form-control" id="playerAge" required min="16" max="45">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Tim</label>
                            <select class="form-select" id="playerTeam" required>
                                <option value="">Izaberi tim</option>
                            </select>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Otkaži</button>
                    <button type="button" class="btn btn-primary" id="savePlayerBtn">Sačuvaj</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Player Modal -->
    <div class="modal fade" id="editPlayerModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Izmeni igrača</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="editPlayerForm">
                        <input type="hidden" id="editPlayerId">
                        <div class="mb-3">
                            <label class="form-label">Ime i prezime</label>
                            <input type="text" class="form-control" id="editPlayerName" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Pozicija</label>
                            <select class="form-select" id="editPlayerPosition" required>
                                <option value="">Izaberi poziciju</option>
                                <option value="PG">Point Guard (PG)</option>
                                <option value="SG">Shooting Guard (SG)</option>
                                <option value="SF">Small Forward (SF)</option>
                                <option value="PF">Power Forward (PF)</option>
                                <option value="C">Center (C)</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Godine</label>
                            <input type="number" class="form-control" id="editPlayerAge" required min="16" max="45">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Tim</label>
                            <select class="form-select" id="editPlayerTeam" required>
                                <option value="">Izaberi tim</option>
                            </select>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Otkaži</button>
                    <button type="button" class="btn btn-primary" id="updatePlayerBtn">Sačuvaj izmene</button>
                </div>
            </div>
        </div>
    </div>

    <footer class="bg-dark text-white text-center py-3 mt-5">
        <p class="m-0">© 2023 Košarkaški timovi i igrači - CRUD aplikacija</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
